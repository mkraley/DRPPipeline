<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DRP Pipeline Dashboard</title>
  <style>
    :root {
      --bg: #1e1e1e;
      --panel: #252526;
      --border: #3c3c3c;
      --text: #d4d4d4;
      --muted: #9d9d9d;
      --running: #3fa66b;
      --stale: #c9a227;
      --completed: #569cd6;
      --stopped: #ce9178;
      --failed: #f14c4c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 13px/1.45 Consolas, "Cascadia Mono", monospace;
      background: var(--bg);
      color: var(--text);
      padding: 10px 12px 24px;
    }
    h1 {
      font-size: 15px;
      font-weight: 600;
      margin: 0 0 4px;
    }
    .meta {
      color: var(--muted);
      margin-bottom: 14px;
      font-size: 12px;
    }
    h2 {
      font-size: 13px;
      font-weight: 600;
      margin: 16px 0 8px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 4px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px 10px;
      margin-bottom: 8px;
    }
    .card-body {
      display: flex;
      gap: 10px;
      align-items: stretch;
    }
    .card-main {
      flex: 1;
      min-width: 0;
    }
    .card-chart {
      flex: 0 0 168px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 2px;
    }
    .chart-label {
      font-size: 10px;
      color: var(--muted);
      text-align: right;
    }
    .chart {
      width: 168px;
      height: 52px;
      background: #1a1a1a;
      border: 1px solid var(--border);
      border-radius: 3px;
      display: block;
    }
    .empty-chart {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: var(--muted);
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: baseline;
      margin-bottom: 4px;
    }
    .badge {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      color: #111;
    }
    .badge.running { background: var(--running); }
    .badge.stale { background: var(--stale); }
    .badge.completed { background: var(--completed); }
    .badge.stopped { background: var(--stopped); }
    .badge.failed { background: var(--failed); }
    .cmd { word-break: break-all; }
    .progress { color: #b5cea8; margin-top: 4px; }
    .muted { color: var(--muted); }
    .empty { color: var(--muted); font-style: italic; }
    .stats-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .stats-list li {
      display: flex;
      gap: 10px;
      align-items: baseline;
      padding: 2px 0;
      border-bottom: 1px solid var(--border);
    }
    .stats-list .label { white-space: nowrap; }
    .stats-list .count {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      min-width: 2ch;
    }
    .stats-header { margin-bottom: 8px; }
    .error { color: var(--failed); }
    .throughput-chart { width: 100%; height: 210px; display: block; }
    .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 4px; }
    .legend-item { color: var(--text); }
    .swatch {
      display: inline-block;
      width: 14px;
      height: 3px;
      margin-right: 5px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <h1>DRP Pipeline</h1>
  <div class="meta" id="refresh-meta">Loading…</div>

  <h2>Throughput</h2>
  <div id="throughput" class="card">Loading…</div>

  <h2>Batches</h2>
  <div id="runs"></div>

  <h2>Pipeline status</h2>
  <div id="stats"></div>

  <script>
    const POLL_MS = 10000;

    function esc(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatStart(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return iso;
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      const dd = String(d.getDate()).padStart(2, "0");
      const hh = String(d.getHours()).padStart(2, "0");
      const mi = String(d.getMinutes()).padStart(2, "0");
      return `${mm}-${dd} ${hh}${mi}`;
    }

    function badgeTitle(status) {
      if (status === "stale") {
        return "Status file still says running, but the process is gone";
      }
      return status;
    }

    function formatDurationShort(sec) {
      const total = Math.max(0, Math.round(Number(sec) || 0));
      if (total < 60) return `${total}s`;
      const m = Math.floor(total / 60);
      const s = total % 60;
      if (m < 60) return `${m}m ${s}s`;
      const h = Math.floor(m / 60);
      return `${h}h ${m % 60}m`;
    }

    function outcomeColor(outcome) {
      if (outcome === "error") return "var(--failed)";
      if (outcome === "warning") return "var(--stale)";
      return "var(--running)";
    }

    function renderTimingChart(samples) {
      if (!samples || !samples.length) {
        return `
          <div class="chart-label">duration × time</div>
          <div class="chart empty-chart" title="Dots appear as each project finishes">no samples yet</div>`;
      }
      const points = samples
        .map((s) => {
          const t = Date.parse(s.finished_at || "");
          const dur = Number(s.duration_sec);
          if (!Number.isFinite(t) || !Number.isFinite(dur)) return null;
          return {
            t,
            dur,
            outcome: s.outcome || "ok",
            drpid: s.drpid,
          };
        })
        .filter(Boolean);
      if (!points.length) {
        return `
          <div class="chart-label">duration × time</div>
          <div class="chart empty-chart">no samples yet</div>`;
      }
      const w = 168;
      const h = 52;
      const padL = 2;
      const padR = 4;
      const padT = 4;
      const padB = 4;
      let minT = Math.min(...points.map((p) => p.t));
      let maxT = Math.max(...points.map((p) => p.t));
      let maxDur = Math.max(...points.map((p) => p.dur), 1);
      if (maxT <= minT) maxT = minT + 1000;
      const xSpan = maxT - minT;
      const dots = points
        .map((p) => {
          const x = padL + ((p.t - minT) / xSpan) * (w - padL - padR);
          const y = padT + (1 - p.dur / maxDur) * (h - padT - padB);
          const title = `DRPID ${p.drpid}: ${formatDurationShort(p.dur)} (${p.outcome})`;
          return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.4"
            fill="${outcomeColor(p.outcome)}" title="${esc(title)}">
            <title>${esc(title)}</title>
          </circle>`;
        })
        .join("");
      return `
        <div class="chart-label">0–${esc(formatDurationShort(maxDur))} · ${points.length} proj</div>
        <svg class="chart" viewBox="0 0 ${w} ${h}" role="img"
          aria-label="Project duration over batch time">
          <line x1="${padL}" y1="${(h - padB).toFixed(1)}"
            x2="${(w - padR).toFixed(1)}" y2="${(h - padB).toFixed(1)}"
            stroke="#3c3c3c" stroke-width="1"/>
          ${dots}
        </svg>`;
    }

    function renderRuns(runs) {
      const el = document.getElementById("runs");
      if (!runs || !runs.length) {
        el.innerHTML = '<div class="empty">No recent main.py batches</div>';
        return;
      }
      el.innerHTML = runs.map((r) => {
        const status = esc(r.status || "unknown");
        const ended = r.ended_at
          ? `<span class="muted">ended ${esc(formatStart(r.ended_at))}</span>`
          : "";
        const errors = Number(r.errors || 0);
        const warnings = Number(r.warnings || 0);
        const termId = r.terminal_pid || r.pid;
        const pyPid =
          r.terminal_pid && r.pid && r.terminal_pid !== r.pid
            ? `<span class="muted">python ${esc(r.pid)}</span>`
            : "";
        return `
          <div class="card">
            <div class="card-body">
              <div class="card-main">
                <div class="row">
                  <span class="badge ${status}" title="${esc(badgeTitle(r.status))}">${status}</span>
                  <strong>terminal ${esc(termId)}</strong>
                  <span>${esc(r.module)}</span>
                  ${pyPid}
                </div>
                <div class="cmd">${esc(r.command_line)}</div>
                <div class="row muted">
                  <span>started ${esc(formatStart(r.started_at))}</span>
                  ${ended}
                  <span>errors=${esc(errors)} warnings=${esc(warnings)}</span>
                </div>
                <div class="progress">${esc(r.progress_line || "")}</div>
              </div>
              <div class="card-chart">${renderTimingChart(r.project_samples)}</div>
            </div>
          </div>`;
      }).join("");
    }

    function renderStats(stats) {
      const el = document.getElementById("stats");
      if (!stats) {
        el.innerHTML = '<div class="empty">No stats</div>';
        return;
      }
      if (stats.error) {
        el.innerHTML = `<div class="card error">${esc(stats.error)}</div>`;
        return;
      }
      const rows = (stats.by_status || []).map((r) => {
        const label = r.label || r.status;
        return `<li>
          <span class="label">${esc(label)}</span>
          <span class="count">${esc(r.count)}</span>
        </li>`;
      }).join("");
      el.innerHTML = `
        <div class="stats-header muted">
          source=<strong>${esc(stats.source)}</strong>
          db=<strong>${esc(stats.db_path)}</strong>
        </div>
        <div class="card">
          <div class="row">
            <span>total <strong>${esc(stats.total)}</strong></span>
            <span>errors <strong>${esc(stats.with_errors)}</strong></span>
            <span>warnings <strong>${esc(stats.with_warnings)}</strong></span>
          </div>
          <ul class="stats-list">
            ${rows || '<li class="empty">No projects</li>'}
          </ul>
        </div>`;
    }

    function renderThroughput(data) {
      const el = document.getElementById("throughput");
      if (!data || data.error) {
        el.innerHTML = `<div class="error">${esc((data && data.error) || "No throughput data")}</div>`;
        return;
      }
      const hours = data.hours || [];
      const series = data.series || {};
      const spec = [
        ["upload_ok", "Upload success", "#3fa66b"],
        ["upload_fail", "Upload failure", "#f14c4c"],
        ["publish_ok", "Publish success", "#569cd6"],
        ["publish_fail", "Publish failure", "#ce9178"],
      ];
      if (!hours.length) {
        el.innerHTML = '<div class="empty">No hourly completions in the last 48 hours</div>';
        return;
      }
      const chart = throughputSvg(hours, series, spec);
      const legend = spec.map(([key, label, color]) => {
        const total = (series[key] || []).reduce((sum, value) => sum + value, 0);
        return `<span class="legend-item"><span class="swatch" style="background:${color}"></span>${esc(label)} ${total}</span>`;
      }).join("");
      el.innerHTML = `
        <div class="legend">${legend}</div>
        ${chart}
        <div class="muted">Completions per wall-clock hour from drp_pipeline.log, last 48 hours. A project is a failure when an error was logged before it finished.</div>`;
    }

    function throughputSvg(hours, series, spec) {
      const w = 960;
      const h = 200;
      const padL = 36;
      const padR = 12;
      const padT = 12;
      const padB = 28;
      let maxY = 1;
      spec.forEach(([key]) => {
        (series[key] || []).forEach((value) => {
          if (value > maxY) maxY = value;
        });
      });
      const n = hours.length;
      const xAt = (index) => padL + (n === 1 ? 0 : (index / (n - 1)) * (w - padL - padR));
      const yAt = (value) => padT + (1 - value / maxY) * (h - padT - padB);
      const lines = spec.map(([key, , color]) => {
        const points = (series[key] || [])
          .map((value, index) => `${xAt(index).toFixed(1)},${yAt(value).toFixed(1)}`)
          .join(" ");
        return `<polyline fill="none" stroke="${color}" stroke-width="2" points="${points}"/>`;
      }).join("");
      const labels = hours.map((label, index) => {
        if (index % 6 !== 0 && index !== n - 1) return "";
        return `<text x="${xAt(index).toFixed(1)}" y="${h - 8}" fill="#9d9d9d" font-size="10" text-anchor="middle">${esc(label)}</text>`;
      }).join("");
      const ticks = [0, Math.round(maxY / 2), maxY].map((value) => {
        return `<text x="2" y="${(yAt(value) + 3).toFixed(1)}" fill="#9d9d9d" font-size="10">${value}</text>`;
      }).join("");
      return `<svg class="throughput-chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Completions per hour for the last 48 hours">
        <line x1="${padL}" y1="${yAt(0)}" x2="${w - padR}" y2="${yAt(0)}" stroke="#3c3c3c"/>
        ${lines}${labels}${ticks}
      </svg>`;
    }

    async function refresh() {
      const meta = document.getElementById("refresh-meta");
      try {
        const [runsRes, statsRes, throughputRes] = await Promise.all([
          fetch("/api/runs", { cache: "no-store" }),
          fetch("/api/stats", { cache: "no-store" }),
          fetch("/api/throughput", { cache: "no-store" }),
        ]);
        const runsBody = await runsRes.json();
        const statsBody = await statsRes.json();
        const throughputBody = await throughputRes.json();
        const runs = runsBody.runs || [];
        renderThroughput(throughputBody);
        renderRuns(runs);
        renderStats(statsBody);
        const running = runs.filter((r) => r.status === "running").length;
        meta.textContent =
          "Updated " +
          new Date().toLocaleTimeString() +
          ` · ${runs.length} batch(es), ${running} running · every 10s`;
      } catch (err) {
        meta.textContent = "Refresh failed: " + err;
      }
    }

    refresh();
    setInterval(refresh, POLL_MS);
  </script>
</body>
</html>
